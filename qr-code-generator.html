<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QR code generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f6; --panel:#ffffff; --ink:#14213d; --muted:#5b6785; --line:#d3d9e6; --accent:#2446d6; --accent-ink:#ffffff; --tile:#ffffff;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0e1424; --panel:#161e33; --ink:#e8ecf7; --muted:#9aa6c4; --line:#2a3552; --accent:#7f9bff; --accent-ink:#0e1424;}
}
:root[data-theme="dark"]{--bg:#0e1424; --panel:#161e33; --ink:#e8ecf7; --muted:#9aa6c4; --line:#2a3552; --accent:#7f9bff; --accent-ink:#0e1424;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:880px;margin:0 auto;padding:32px 20px 48px}
h1{font-size:clamp(2rem,6vw,3.2rem);font-weight:800;letter-spacing:-0.03em;line-height:1.05;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 28px;max-width:46ch}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
@media (max-width:720px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
label{display:block;font-weight:600;margin:0 0 6px}
textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
textarea{min-height:120px;resize:vertical}
textarea:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:12px;margin-top:16px}
.row>div{flex:1}
.hint{color:var(--muted);font-size:.875rem;margin:6px 0 0}
.stage{display:flex;flex-direction:column;align-items:center;gap:14px}
.tile{background:var(--tile);border-radius:12px;padding:18px;display:flex;align-items:center;justify-content:center;min-width:200px;min-height:200px;max-width:100%}
.tile img,.tile canvas{max-width:100%;height:auto;display:block}
#qr canvas{display:none}
.empty{color:#6b7488;text-align:center;font-size:.95rem;max-width:20ch}
.err{color:#b3261e;text-align:center;font-size:.95rem}
:root[data-theme="dark"] .err,:root:not([data-theme="light"]) .err{color:#ff9a92}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .err{color:#b3261e}}
button{font:inherit;font-weight:600;background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:10px 16px;cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.note{color:var(--muted);font-size:.875rem;text-align:center;margin:0;max-width:34ch}
</style>
</head>
<body>
<main>
  <h1>QR code generator</h1>
  <p class="sub">Paste a link or any text. The code updates as you type.</p>

  <div class="grid">
    <section class="panel">
      <label for="text">Link or text</label>
      <textarea id="text" placeholder="https://example.com" autofocus></textarea>
      <div class="row">
        <div>
          <label for="size">Size</label>
          <select id="size">
            <option value="192">Small</option>
            <option value="256" selected>Medium</option>
            <option value="320">Large</option>
          </select>
        </div>
        <div>
          <label for="level">Error correction</label>
          <select id="level">
            <option value="L">Low</option>
            <option value="M" selected>Medium</option>
            <option value="Q">Quartile</option>
            <option value="H">High</option>
          </select>
        </div>
      </div>
      <p class="hint">Higher error correction still scans if the code is smudged, but fits less text.</p>
      <div class="row"><button class="ghost" id="clear" type="button">Clear</button></div>
    </section>

    <section class="panel stage" aria-live="polite">
      <div class="tile" id="tile">
        <div class="empty" id="empty">Your QR code will appear here.</div>
        <div id="qr" hidden></div>
        <div class="err" id="err" hidden></div>
      </div>
      <div class="actions" id="actions" hidden>
        <button id="copy" type="button">Copy text</button>
      </div>
      <p class="note" id="note" hidden>To save the image, press and hold it on a phone, or right-click it on a computer.</p>
    </section>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function(){
  var $ = function(id){return document.getElementById(id)};
  var text=$("text"), size=$("size"), level=$("level");
  var qr=$("qr"), empty=$("empty"), err=$("err"), actions=$("actions"), note=$("note");
  var timer;

  function show(state, msg){
    empty.hidden = state!=="empty";
    qr.hidden = state!=="ok";
    err.hidden = state!=="err";
    actions.hidden = note.hidden = state!=="ok";
    if(state==="err") err.textContent = msg;
  }

  function render(){
    var value = text.value.trim();
    qr.innerHTML = "";
    if(!value){ show("empty"); return; }
    var px = parseInt(size.value,10);
    try{
      new QRCode(qr,{
        text: unescape(encodeURIComponent(value)),
        width: px, height: px,
        colorDark:"#000000", colorLight:"#ffffff",
        correctLevel: QRCode.CorrectLevel[level.value]
      });
      show("ok");
    }catch(e){
      show("err","That text is too long for this error-correction level. Shorten it or choose Low.");
    }
  }

  function schedule(){ clearTimeout(timer); timer=setTimeout(render,150); }
  text.addEventListener("input",schedule);
  size.addEventListener("change",render);
  level.addEventListener("change",render);
  $("clear").addEventListener("click",function(){ text.value=""; render(); text.focus(); });
  $("copy").addEventListener("click",function(){
    var b=$("copy");
    try{
      navigator.clipboard.writeText(text.value).then(function(){ b.textContent="Copied"; setTimeout(function(){b.textContent="Copy text"},1500); });
    }catch(e){ text.select(); }
  });
  render();
})();
</script>
</body>
</html>
